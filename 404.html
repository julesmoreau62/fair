<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · FAIR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07111F">
<link rel="icon" href="/assets/logo/fair-icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--night:#07111F;--chalk:#EDF0EA;--fog:#A7B3C5;--mist:#CBD3DE;--turf:#1FB57A;--turf-hi:#43D99A;--line:rgba(237,240,234,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--night);color:var(--mist);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
main{max-width:640px;padding:48px 16px}
.code{font-family:"Martian Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--turf-hi);margin:24px 0 0}
h1{font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:clamp(3rem,12vw,5.6rem);line-height:.86;color:var(--chalk);margin:12px 0 20px}
p{margin:0 0 24px}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:4px;border:1px solid var(--line);color:var(--chalk);font-weight:600;text-decoration:none}
.links a:first-child{background:var(--turf);border-color:var(--turf);color:var(--night)}
.links a:hover{border-color:var(--mist)}
.links a:first-child:hover{background:var(--turf-hi)}
:focus-visible{outline:3px solid var(--turf);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo/fair-icone.svg" width="56" height="56" alt="FAIR">
  <p class="code">Erreur 404</p>
  <h1>Hors-jeu.</h1>
  <p>Cette page n'existe pas, ou plus. Le lien est peut-être incomplet, ou la page a changé d'adresse.</p>
  <div class="links">
    <a href="/">Retour à l'accueil</a>
    <a href="/formation.html">La formation</a>
    <a href="/index.html#contact">Nous écrire</a>
  </div>
</main>
</body>
</html>
